name: FixBrief AI
description: AI-powered pull request reviews with any LLM, large-PR support, and fix briefs for AI coding assistants.
author: kadraman

branding:
  icon: eye
  color: purple

inputs:
  api-key:
    description: API key for your LLM provider (pass it from a repository secret).
    required: true
  model:
    description: Model name, exactly as your provider's API expects it (recommended gpt-6.1-terra). gpt-5-mini shuts down on 2026-12-11.
    required: true
  provider:
    description: "API protocol: 'openai' (any OpenAI-compatible API) or 'anthropic'."
    required: false
    default: openai
  base-url:
    description: Optional API root override (e.g. https://api.deepseek.com). Leave blank for OpenAI.
    required: false
    default: ""
  temperature:
    description: Sampling temperature (default 0). gpt-5, gpt-6, and o-series models omit this parameter. Set to 'none' to omit it for any other model.
    required: false
    default: ""
  consistency-runs:
    description: Independent review passes for agreement scoring (1-5, default 2). Extra runs use CONSISTENCY_TEMPERATURE, except on models that omit temperature (gpt-5, gpt-6, o-series), which repeat the same request. Agreement adjusts confidence; critical/high that clear the floor still publish as one-offs. One-off medium findings stay out of the fix brief.
    required: false
    default: "2"
  max-output-tokens:
    description: Max output tokens per call (required by the Anthropic API).
    required: false
    default: "8192"
  batch-chars:
    description: Maximum diff characters packed per API call.
    required: false
    default: "100000"
  piece-chars:
    description: Max characters per file piece before hunk-splitting (keeps large files from failing as one batch). Default 20000.
    required: false
    default: "20000"
  max-batches:
    description: Cost guard. Batches beyond this are listed as not reviewed.
    required: false
    default: "40"
  workers:
    description: Number of parallel API calls.
    required: false
    default: "3"
  minimum-confidence:
    description: Confidence floor for critical and high findings (0..1). Medium findings at or above the fix-brief floor are also posted as review threads. Low, info, and weaker findings stay in the job summary.
    required: false
    default: "0.85"
  categories:
    description: "Comma-separated finding categories to keep (security, quality, maintainability, performance, architecture, testing, documentation, compliance), or 'all'. Style/lint nits stay out of scope."
    required: false
    default: "all"
  max-inline-comments:
    description: Optional cap on review threads (line and file comments together); 0 means no cap. Overflow is listed in the overview and in one checklist comment.
    required: false
    default: "0"
  fix-brief:
    description: "'true' to also produce fix-brief.md for an AI coding assistant."
    required: false
    default: "true"
  post-comment:
    description: "'true' to post the review as a PR comment."
    required: false
    default: "true"
  github-token:
    description: Token used to post the comment (needs pull-requests write).
    required: false
    default: ${{ github.token }}
  diff-context-lines:
    description: Lines of context around each change in the diff the model reads (GitHub's own diff has 3).
    required: false
    default: "10"
  context-chars:
    description: Cap for the reference context added to each review call (overview, guidance, usages, callee bodies). 0 turns it off. This is a checkout lookup, not an embedding index.
    required: false
    default: "12000"
  context-definitions:
    description: How many functions called by the changed lines have their bodies read from the checkout. 0 skips that lookup.
    required: false
    default: "6"
  definition-lines:
    description: Max lines of one callee body included in the reference context.
    required: false
    default: "80"
  refute:
    description: "'true' to run one disproof pass over findings that would be posted or written into the fix brief. A finding is dropped only on an explicit keep=false with a reason."
    required: false
    default: "true"
  refute-model:
    description: Optional model for the disproof pass. Leave blank to use the review model.
    required: false
    default: ""
  refute-provider:
    description: "Optional API protocol for the disproof pass: 'openai' or 'anthropic'. Leave blank to use the review provider."
    required: false
    default: ""
  refute-base-url:
    description: Optional API root for the disproof pass. Leave blank to use the review base URL (or the provider default when the provider changes).
    required: false
    default: ""
  debug-artifacts:
    description: "true to upload findings.json, review-payload.json, fix-brief-targets.json, and scope.txt (they contain code excerpts — keep off unless you need them)."
    required: false
    default: "false"

outputs:
  review-path:
    description: Path to the generated review.md.
    value: ${{ steps.review.outputs.review_path }}
  fix-brief-path:
    description: Path to fix-brief.md (empty if there was nothing actionable).
    value: ${{ steps.review.outputs.brief_path }}
  fix-brief-url:
    description: Download URL of the uploaded fix-brief artifact.
    value: ${{ steps.upload.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Compute diffs
      id: diffs
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        OUT_DIR: ${{ runner.temp }}/fixbrief-ai
        BASE_REF: ${{ github.base_ref }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BEFORE_SHA: ${{ github.event.before }}
        PR_ACTION: ${{ github.event.action }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        DIFF_CONTEXT_LINES: ${{ inputs.diff-context-lines }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        if [ -z "${BASE_REF:-}" ]; then
          echo "::error::fixbrief-ai must run on a pull_request event."
          exit 1
        fi
        bash "$ACTION_PATH/scripts/compute-diffs.sh"

    - name: Set up Node.js for the TypeScript renderer
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Run review
      id: review
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        LLM_API_KEY: ${{ inputs.api-key }}
        LLM_MODEL: ${{ inputs.model }}
        LLM_PROVIDER: ${{ inputs.provider }}
        LLM_BASE_URL: ${{ inputs.base-url }}
        LLM_TEMPERATURE: ${{ inputs.temperature }}
        CONSISTENCY_RUNS: ${{ inputs.consistency-runs }}
        LLM_MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
        BATCH_CHARS: ${{ inputs.batch-chars }}
        PIECE_CHARS: ${{ inputs.piece-chars }}
        MAX_BATCHES: ${{ inputs.max-batches }}
        WORKERS: ${{ inputs.workers }}
        MINIMUM_CONFIDENCE: ${{ inputs.minimum-confidence }}
        CATEGORIES: ${{ inputs.categories }}
        MAX_INLINE_COMMENTS: ${{ inputs.max-inline-comments }}
        FIX_BRIEF: ${{ inputs.fix-brief }}
        ANCHOR_DIFF_FILE: ${{ runner.temp }}/fixbrief-ai/anchor.diff
        CONTEXT_CHARS: ${{ inputs.context-chars }}
        CONTEXT_DEFINITIONS: ${{ inputs.context-definitions }}
        DEFINITION_LINES: ${{ inputs.definition-lines }}
        REFUTE: ${{ inputs.refute }}
        LLM_REFUTE_MODEL: ${{ inputs.refute-model }}
        LLM_REFUTE_PROVIDER: ${{ inputs.refute-provider }}
        LLM_REFUTE_BASE_URL: ${{ inputs.refute-base-url }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_HEAD: ${{ github.head_ref }}
        PR_BASE: ${{ github.base_ref }}
        REPO: ${{ github.repository }}
        BEFORE_SHA: ${{ github.event.before }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/fixbrief-ai"
        scope="$(cat "$out/scope.txt" 2>/dev/null || echo full)"
        if [ "$scope" = "incremental" ] && [ -n "${BEFORE_SHA:-}" ]; then
          SHORT="$(git rev-parse --short "$BEFORE_SHA" 2>/dev/null || echo "${BEFORE_SHA:0:7}")"
          export REVIEW_SCOPE="Reviewed changes since ${SHORT} (incremental push), not the full pull request."
        else
          export REVIEW_SCOPE="Reviewed the full pull request diff against origin/${BASE_REF}."
        fi
        node --experimental-strip-types "$ACTION_PATH/src/fixbrief-ai.ts" --diff "$out/pr.diff" --out-dir "$out"
        echo "review_path=$out/review.md" >> "$GITHUB_OUTPUT"
        if [ -f "$out/fix-brief.md" ]; then
          echo "has_brief=true" >> "$GITHUB_OUTPUT"
          echo "brief_path=$out/fix-brief.md" >> "$GITHUB_OUTPUT"
        fi
        echo "review_payload_path=$out/review-payload.json" >> "$GITHUB_OUTPUT"

    - name: Post review comment
      id: post
      if: inputs.post-comment == 'true' && github.event.pull_request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_ACTION: ${{ github.event.action }}
        REVIEW_PAYLOAD: ${{ steps.review.outputs.review_payload_path }}
        REPO: ${{ github.repository }}
        ACTION_PATH: ${{ github.action_path }}
        HAS_BRIEF: ${{ steps.review.outputs.has_brief }}
      run: |
        set -euo pipefail
        OUT="$RUNNER_TEMP/fixbrief-ai"
        # Hold the review pending by omitting event (the string PENDING is HTTP 422).
        # GitHub's conversation page keeps the body from submit time and does not
        # show a link added by editing the review later. A failed create-review
        # sets fallback so the overview is posted after the fix-brief link exists.
        HEAD_SHA="${{ github.event.pull_request.head.sha }}" \
          PR_ACTION="$PR_ACTION" \
          bash "$ACTION_PATH/scripts/post-review.sh" "$OUT" "$ACTION_PATH"
        set -a
        # shellcheck disable=SC1091
        source "$OUT/post-result.env"
        set +a
        echo "posted=$posted" >> "$GITHUB_OUTPUT"
        echo "pending=$pending" >> "$GITHUB_OUTPUT"
        echo "fallback=${fallback:-false}" >> "$GITHUB_OUTPUT"
        echo "review_id=$review_id" >> "$GITHUB_OUTPUT"

    - name: Attach fix-brief report-back
      if: steps.review.outputs.has_brief == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BRIEF_PATH: ${{ steps.review.outputs.brief_path }}
      run: |
        set -euo pipefail
        OUT="$RUNNER_TEMP/fixbrief-ai"
        TARGETS="$OUT/fix-brief-targets.json"
        COMMENTS="$OUT/posted-comments.json"
        if [ ! -f "$COMMENTS" ]; then echo "[]" > "$COMMENTS"; fi
        if [ ! -f "$TARGETS" ]; then
          echo "No fix-brief-targets.json; skipping report-back attach."
          exit 0
        fi
        CHECKLIST_ARGS=()
        if [ -f "$OUT/checklist-comment.json" ]; then
          CHECKLIST_ARGS=(--checklist "$OUT/checklist-comment.json")
        fi
        node --experimental-strip-types "$ACTION_PATH/src/attach-replies.ts" \
          --brief "$BRIEF_PATH" --targets "$TARGETS" --comments "$COMMENTS" \
          ${CHECKLIST_ARGS[@]+"${CHECKLIST_ARGS[@]}"}

    - name: Upload fix brief
      id: upload
      if: steps.review.outputs.has_brief == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: fix-brief-pr-${{ github.event.pull_request.number }}
        path: ${{ steps.review.outputs.brief_path }}
        retention-days: 14

    - name: Submit review with fix-brief link
      if: ${{ !cancelled() && (steps.post.outputs.pending == 'true' || steps.post.outputs.fallback == 'true') }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        REVIEW_ID: ${{ steps.post.outputs.review_id }}
        REVIEW_PAYLOAD: ${{ steps.review.outputs.review_payload_path }}
        BRIEF_URL: ${{ steps.upload.outputs.artifact-url }}
      run: |
        set -euo pipefail
        # The conversation page shows the body from this submit call. A later PUT
        # updates the API and leaves the page on the original text.
        OUT="$RUNNER_TEMP/fixbrief-ai"
        SUBMIT="$OUT/review-submit.json"
        COMMENT="$OUT/comment.md"
        PAYLOAD="$OUT/deduped-payload.json"
        if [ ! -f "$PAYLOAD" ]; then PAYLOAD="$REVIEW_PAYLOAD"; fi
        CHECKLIST_URL=""
        CHECKLIST_ID=""
        if [ -f "$OUT/checklist-comment.json" ]; then
          CHECKLIST_ID="$(node -e 'const row=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); process.stdout.write(row.id?String(row.id):"")' "$OUT/checklist-comment.json")"
          if [ -n "$CHECKLIST_ID" ]; then
            CHECKLIST_URL="https://github.com/${REPO}/pull/${PR_NUMBER}#issuecomment-${CHECKLIST_ID}"
          fi
        fi
        link_note() {
          if [ -n "${BRIEF_URL:-}" ]; then
            echo "$1 with the fix-brief link."
          else
            echo "::warning::$1 without a fix-brief link (artifact URL missing)."
          fi
        }
        # Create-review failed and the overview is already one issue comment. Add the
        # download link with a PATCH so the report-back brief can keep that comment id.
        if [ -z "${REVIEW_ID:-}" ]; then
          if [ ! -f "$COMMENT" ]; then
            echo "::warning::Create-review failed and no fallback body was written."
            exit 1
          fi
          node --experimental-strip-types --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { pathToFileURL } from "node:url";
            const { appendBriefDownloadLink } = await import(pathToFileURL(process.argv[3]).href);
            let body = readFileSync(process.argv[1], "utf8");
            const briefUrl = process.argv[2];
            if (briefUrl) body = appendBriefDownloadLink(body, briefUrl);
            writeFileSync(process.argv[1], body.endsWith("\n") ? body : body + "\n");
          ' "$COMMENT" "${BRIEF_URL:-}" "$ACTION_PATH/src/attach-replies.ts"
          if [ -n "$CHECKLIST_ID" ]; then
            node --input-type=module -e '
              import { readFileSync, writeFileSync } from "node:fs";
              writeFileSync(process.argv[2], JSON.stringify({ body: readFileSync(process.argv[1], "utf8") }));
            ' "$COMMENT" "$OUT/issue-comment.json"
            gh api --method PATCH "repos/$REPO/issues/comments/$CHECKLIST_ID" --input "$OUT/issue-comment.json" >/dev/null
            link_note "Updated overview comment"
          else
            gh pr comment "$PR_NUMBER" --body-file "$COMMENT"
            link_note "Posted overview comment"
          fi
          exit 0
        fi
        node --experimental-strip-types --input-type=module -e '
          import { readFileSync, writeFileSync } from "node:fs";
          import { pathToFileURL } from "node:url";
          const { appendBriefDownloadLink, appendChecklistLink } = await import(pathToFileURL(process.argv[5]).href);
          const payload = JSON.parse(readFileSync(process.argv[1], "utf8"));
          const briefUrl = process.argv[2];
          const checklistUrl = process.argv[6];
          let body = payload.body;
          if (checklistUrl) body = appendChecklistLink(body, checklistUrl);
          if (briefUrl) body = appendBriefDownloadLink(body, briefUrl);
          writeFileSync(process.argv[3], JSON.stringify({ body, event: "COMMENT" }));
          const parts = [body.trimEnd()];
          for (const comment of payload.comments || []) {
            parts.push("", "---", "", `**\`${comment.path}:${comment.line ?? ""}\`**`, "", comment.body);
          }
          for (const comment of payload.fileComments || []) {
            parts.push("", "---", "", `**\`${comment.path}\`**`, "", comment.body);
          }
          writeFileSync(process.argv[4], parts.join("\n") + "\n");
        ' "$PAYLOAD" "${BRIEF_URL:-}" "$SUBMIT" "$COMMENT" "$ACTION_PATH/src/attach-replies.ts" "${CHECKLIST_URL}"
        if gh api --method POST "repos/$REPO/pulls/$PR_NUMBER/reviews/$REVIEW_ID/events" --input "$SUBMIT" >"$OUT/submit.out" 2>"$OUT/submit.err"; then
          link_note "Submitted review $REVIEW_ID"
        else
          detail="$(tr '\n' ' ' < "$OUT/submit.err")"
          body="$(tr '\n' ' ' < "$OUT/submit.out")"
          echo "::warning::Could not submit the pending review (${detail:-$body}); posting the overview as an issue comment."
          gh pr comment "$PR_NUMBER" --body-file "$COMMENT"
          gh api --method DELETE "repos/$REPO/pulls/$PR_NUMBER/reviews/$REVIEW_ID" >/dev/null || true
          link_note "Posted overview comment"
        fi

    - name: Upload debug artifacts
      if: always() && inputs.debug-artifacts == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: fixbrief-ai-debug-pr-${{ github.event.pull_request.number }}
        path: |
          ${{ runner.temp }}/fixbrief-ai/findings.json
          ${{ runner.temp }}/fixbrief-ai/review-payload.json
          ${{ runner.temp }}/fixbrief-ai/fix-brief-targets.json
          ${{ runner.temp }}/fixbrief-ai/scope.txt
        retention-days: 7
        if-no-files-found: ignore
